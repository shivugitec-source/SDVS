name: SDVS backend validation
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python modules
        working-directory: backend
        run: python -m compileall -q app
      - name: Import API and inspect routes
        working-directory: backend
        env:
          JWT_SECRET: ci-only-secret-not-for-production
          OTP_SECRET: ci-only-otp-secret
        run: |
          python - <<'PY'
          from app.main import app
          paths = {route.path for route in app.routes}
          required = {"/health", "/auth/request-otp", "/auth/verify-otp", "/admin/users"}
          missing = required - paths
          assert not missing, f"Missing API routes: {sorted(missing)}"
          print(f"Imported SDVS API successfully; {len(paths)} routes registered.")
          PY
