name: SDVS backend validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: sdvs-ci-only
          POSTGRES_DB: sdvs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sdvs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install backend and test dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      - name: Compile Python modules
        working-directory: backend
        run: python -m compileall -q app tests scripts migrations
      - name: Import API and inspect routes
        working-directory: backend
        env:
          JWT_SECRET: ci-only-secret-not-for-production
          OTP_SECRET: ci-only-otp-secret
        run: |
          python - <<'PY'
          from app.main import app
          paths = {route.path for route in app.routes}
          required = {"/health", "/auth/request-otp", "/auth/verify-otp", "/admin/users"}
          missing = required - paths
          assert not missing, f"Missing API routes: {sorted(missing)}"
          print(f"Imported SDVS API successfully; {len(paths)} routes registered.")
          from app.storage import put_object, get_object, check_storage
          assert check_storage() == "local"
          key = "ci-storage-roundtrip.txt"
          put_object(key, b"sdvs-ci-roundtrip", "text/plain")
          assert get_object(key) == b"sdvs-ci-roundtrip"
          print("Local storage adapter round-trip passed.")
          PY
      - name: Validate PostgreSQL migration lifecycle
        working-directory: backend
        env:
          JWT_SECRET: ci-only-secret-not-for-production
          OTP_SECRET: ci-only-otp-secret
          DATABASE_URL: postgresql+psycopg://postgres:sdvs-ci-only@127.0.0.1:5432/sdvs_test
        run: |
          alembic upgrade head
          alembic current
          alembic check
          python scripts/verify_migrations.py
          alembic downgrade base
          python - <<'PY'
          from app import models
          from app.db import Base, engine
          Base.metadata.create_all(bind=engine)
          print("Legacy SQLAlchemy-created schema fixture ready.")
          PY
          python scripts/check_schema_parity.py
          alembic stamp 0001_initial
          alembic upgrade head
          alembic current
          alembic check
          python scripts/verify_migrations.py
      - name: Run backend authorization integration tests
        working-directory: backend
        env:
          JWT_SECRET: ci-only-secret-not-for-production
          OTP_SECRET: ci-only-otp-secret
          DATABASE_URL: postgresql+psycopg://postgres:sdvs-ci-only@127.0.0.1:5432/sdvs_test
        run: python -m unittest discover -s tests -v
