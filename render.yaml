services:
  - type: web
    name: sdvs-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    # This template is not an approval to deploy. Keep deployments manual until
    # the database roles, Alembic head, storage, and secrets are prepared.
    autoDeploy: false
    envVars:
      # Must be the restricted sdvs_app connection string after external
      # provisioning and migrations; never use the bootstrap or migrator URL.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_SECRET
        generateValue: true
      - key: DEV_BOOTSTRAP
        value: "false"
      - key: BOOTSTRAP_USERNAME
        value: admin
      - key: BOOTSTRAP_NAME
        value: SDVS Master Administrator
      - key: BOOTSTRAP_PASSWORD
        sync: false
      - key: BOOTSTRAP_EMAIL
        sync: false
      - key: BOOTSTRAP_PHONE
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: STORAGE_DIR
        value: /tmp/sdvs-uploads
      - key: REQUIRE_R2
        value: "true"
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
