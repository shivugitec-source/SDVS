services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: devs
      POSTGRES_USER: devs
      POSTGRES_PASSWORD: change-this
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devs -d devs"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    image: sdvs-api:local
    build: ./backend
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  api:
    image: sdvs-api:local
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  pgdata:
