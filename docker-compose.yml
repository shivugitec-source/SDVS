services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: devs
      POSTGRES_USER: devs
      POSTGRES_PASSWORD: \${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - "pgdata:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devs -d devs"]
      interval: 5s
      timeout: 5s
      retries: 10

  # This short-lived service is the only application container that receives
  # the bootstrap database administrator password.
  provision:
    image: postgres:16
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: devs
      PGUSER: devs
      PGPASSWORD: \${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SDVS_MIGRATOR_PASSWORD: \${SDVS_MIGRATOR_PASSWORD:?Set SDVS_MIGRATOR_PASSWORD in .env}
      SDVS_APP_PASSWORD: \${SDVS_APP_PASSWORD:?Set SDVS_APP_PASSWORD in .env}
    volumes:
      - "./backend/sql/provision_roles.sql:/scripts/provision_roles.sql:ro"
    command:
      - sh
      - -c
      - until pg_isready; do sleep 1; done; psql -v ON_ERROR_STOP=1 -f /scripts/provision_roles.sql
    depends_on:
      db:
        condition: service_healthy

  # Alembic runs as a non-superuser schema owner. It never shares credentials
  # with the API runtime or the bootstrap administrator.
  migrate:
    image: sdvs-api:local
    build: ./backend
    environment:
      DATABASE_URL: "postgresql+psycopg://sdvs_migrator:\${SDVS_MIGRATOR_PASSWORD:?Set SDVS_MIGRATOR_PASSWORD in .env}@db:5432/devs"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      provision:
        condition: service_completed_successfully

  # The API receives only the restricted runtime database credential.
  api:
    image: sdvs-api:local
    build: ./backend
    environment:
      DATABASE_URL: "postgresql+psycopg://sdvs_app:\${SDVS_APP_PASSWORD:?Set SDVS_APP_PASSWORD in .env}@db:5432/devs"
      JWT_SECRET: \${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_ALGORITHM: \${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_MINUTES: \${ACCESS_TOKEN_MINUTES:-30}
      DEV_BOOTSTRAP: \${DEV_BOOTSTRAP:-0}
      BOOTSTRAP_USERNAME: \${BOOTSTRAP_USERNAME:-master-admin}
      BOOTSTRAP_PASSWORD: \${BOOTSTRAP_PASSWORD:-}
      BOOTSTRAP_NAME: \${BOOTSTRAP_NAME:-SDVS Master Administrator}
      BOOTSTRAP_EMAIL: \${BOOTSTRAP_EMAIL:-}
      BOOTSTRAP_PHONE: \${BOOTSTRAP_PHONE:-}
      OTP_SECRET: \${OTP_SECRET:?Set OTP_SECRET in .env}
      OTP_TTL_MINUTES: \${OTP_TTL_MINUTES:-5}
      SMTP_HOST: \${SMTP_HOST:-}
      SMTP_PORT: \${SMTP_PORT:-587}
      SMTP_USER: \${SMTP_USER:-}
      SMTP_PASSWORD: \${SMTP_PASSWORD:-}
      SMTP_FROM: \${SMTP_FROM:-}
      SMTP_STARTTLS: \${SMTP_STARTTLS:-1}
      TWILIO_ACCOUNT_SID: \${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: \${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: \${TWILIO_FROM_NUMBER:-}
      STORAGE_DIR: \${STORAGE_DIR:-./private_uploads}
      MAX_UPLOAD_MB: \${MAX_UPLOAD_MB:-25}
      REQUIRE_R2: \${REQUIRE_R2:-0}
      R2_ENDPOINT_URL: \${R2_ENDPOINT_URL:-}
      R2_ACCESS_KEY_ID: \${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: \${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: \${R2_BUCKET_NAME:-}
    ports: ["8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
