name: SDVS backend validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: sdvs-ci-only
          POSTGRES_DB: sdvs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sdvs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Validate Compose configuration and credential boundaries
        run: |
          cp .env.example .env
          trap 'rm -f .env /tmp/sdvs-compose.json' EXIT
          docker compose config --format json > /tmp/sdvs-compose.json
          python - <<'PY'
          import json
          with open("/tmp/sdvs-compose.json", encoding="utf-8") as handle:
              config = json.load(handle)
          services = config["services"]
          api = services["api"]["environment"]
          migrate = services["migrate"]["environment"]
          provision = services["provision"]["environment"]
          assert "POSTGRES_PASSWORD" not in api
          assert "SDVS_MIGRATOR_PASSWORD" not in api
          assert "PGPASSWORD" not in api
          assert api["DATABASE_URL"].startswith("postgresql+psycopg://sdvs_app:")
          assert "POSTGRES_PASSWORD" not in migrate
          assert "SDVS_APP_PASSWORD" not in migrate
          assert "PGPASSWORD" not in migrate
          assert migrate["DATABASE_URL"].startswith("postgresql+psycopg://sdvs_migrator:")
          assert provision["PGUSER"] == "devs"
          assert "PGPASSWORD" in provision
          assert "SDVS_MIGRATOR_PASSWORD" in provision
          assert "SDVS_APP_PASSWORD" in provision
          print("Compose configuration valid; bootstrap and migration credentials are isolated from the API.")
          PY
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install backend and test dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      - name: Compile Python modules
        working-directory: backend
        run: python -m compileall -q app tests scripts migrations
      - name: Import API and inspect routes
        working-directory: backend
        env:
          JWT_SECRET: ci-only-secret-not-for-production
          OTP_SECRET: ci-only-otp-secret
        run: |
          python - <<'PY'
          from app.main import app
          paths = {route.path for route in app.routes}
          required = {"/health", "/auth/request-otp", "/auth/verify-otp", "/admin/users"}
          missing = required - paths
          assert not missing, f"Missing API routes: {sorted(missing)}"
          print(f"Imported SDVS API successfully; {len(paths)} routes registered.")
          from app.storage import put_object, get_object, check_storage
          assert check_storage() == "local"
          key = "ci-storage-roundtrip.txt"
          put_object(key, b"sdvs-ci-roundtrip", "text/plain")
          assert get_object(key) == b"sdvs-ci-roundtrip"
          print("Local storage adapter round-trip passed.")
          PY
      - name: Provision restricted PostgreSQL roles
        working-directory: backend
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: sdvs_test
          PGUSER: postgres
          PGPASSWORD: sdvs-ci-only
          SDVS_MIGRATOR_PASSWORD: sdvs-migrator-ci-only-0123456789abcdef
          SDVS_APP_PASSWORD: sdvs-app-ci-only-0123456789abcdef
        run: psql -v ON_ERROR_STOP=1 -f sql/provision_roles.sql
      - name: Validate PostgreSQL migration lifecycle as sdvs_migrator
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://sdvs_migrator:sdvs-migrator-ci-only-0123456789abcdef@127.0.0.1:5432/sdvs_test
        run: |
          alembic upgrade head
          alembic current
          alembic check
          python scripts/verify_migrations.py
          alembic downgrade base
          python - <<'PY'
          from app import models
          from app.db import Base, engine
          Base.metadata.create_all(bind=engine)
          print("Legacy SQLAlchemy-created schema fixture ready.")
          PY
          python scripts/check_schema_parity.py
          alembic stamp 0001_initial
          alembic upgrade head
          alembic current
          alembic check
          python scripts/verify_migrations.py
      - name: Verify restricted PostgreSQL runtime privileges as sdvs_app
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://sdvs_app:sdvs-app-ci-only-0123456789abcdef@127.0.0.1:5432/sdvs_test
        run: python scripts/verify_runtime_privileges.py
      - name: Run backend authorization integration tests
        working-directory: backend
        env:
          JWT_SECRET: ci-only-secret-not-for-production
          OTP_SECRET: ci-only-otp-secret
          DATABASE_URL: postgresql+psycopg://sdvs_app:sdvs-app-ci-only-0123456789abcdef@127.0.0.1:5432/sdvs_test
        run: python -m unittest discover -s tests -v
